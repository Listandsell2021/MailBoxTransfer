# Replace YOUR_DOMAIN with the actual hostname (e.g. mailbox.example.com).
# This file is mounted read-only into the nginx container at /etc/nginx/conf.d/app.conf.

upstream django {
    server web:8000;
}

# HTTP — serves ACME challenge for Let's Encrypt; redirects everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — reverse-proxies to gunicorn.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50M;  # bump if you expect bigger uploads (e.g. mailbox imports)

    # Block search-engine indexing on every response. Applies even when proxy_pass
    # rewrites headers, because of `always`.
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Tell well-behaved crawlers to stay out (Google, Bing, etc. honor this).
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Server-Sent Events stream for live migration logs. Must bypass nginx's
    # response buffering, use HTTP/1.1 for chunked transfer, and allow a very
    # long upstream read timeout because the connection stays open while a
    # migration phase runs.
    location ~ ^/dashboard/[0-9]+/stream/?$ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_redirect off;
        proxy_read_timeout 120s;
    }
}
