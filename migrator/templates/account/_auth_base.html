{% load static socialaccount %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{% block title %}Mailbox Transfer{% endblock %}</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f8fafc;
    --card: #ffffff;
    --card-border: #e5e7eb;
    --text: #0f172a;
    --text-secondary: #334155;
    --muted: #64748b;
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --green: #059669;
    --green-bg: #ecfdf5;
    --green-border: #a7f3d0;
    --red: #dc2626;
    --red-bg: #fef2f2;
    --red-border: #fecaca;
    --orange: #d97706;
    --orange-bg: #fffbeb;
    --orange-border: #fde68a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: 'Inter', -apple-system, "Segoe UI", system-ui, sans-serif;
    background:
      radial-gradient(ellipse 80% 60% at 50% -10%, rgba(79,70,229,.08), transparent 60%),
      radial-gradient(ellipse 60% 50% at 100% 100%, rgba(124,58,237,.06), transparent 60%),
      var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }

  .login-card {
    width: 100%; max-width: 460px;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 36px 36px 28px;
    box-shadow:
      0 1px 2px rgba(15,23,42,.04),
      0 20px 50px -12px rgba(15,23,42,.12);
  }

  .brand {
    display: flex; align-items: center; gap: 10px; margin-bottom: 24px;
    font-size: 15px; font-weight: 700; letter-spacing: -0.015em;
  }
  .brand .logo {
    width: 32px; height: 32px; border-radius: 8px;
    background: linear-gradient(135deg, #4f46e5, #7c3aed);
    display: inline-flex; align-items: center; justify-content: center;
    color: #fff; box-shadow: 0 2px 8px -2px rgba(79,70,229,.45);
  }

  h1 {
    font-size: 22px; font-weight: 700; letter-spacing: -0.02em;
    margin: 0 0 6px;
  }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 22px; }

  form { display: grid; gap: 12px; margin: 0; }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .field label {
    display: block;
    font-size: 12px; font-weight: 600;
    color: var(--text-secondary);
    margin: 0 0 5px;
  }
  .field input {
    width: 100%; padding: 9px 12px;
    background: #ffffff; color: var(--text);
    border: 1px solid var(--card-border);
    border-radius: 8px;
    font: inherit; font-size: 14px;
    transition: border-color .15s, box-shadow .15s;
  }
  .field input:focus {
    outline: none; border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(79,70,229,.12);
  }
  .field-error { color: var(--red); font-size: 12px; margin-top: 4px; font-weight: 500; }

  .pw-wrap { position: relative; }
  .pw-wrap input { padding-right: 38px; }
  .pw-toggle {
    position: absolute; top: 50%; right: 6px;
    transform: translateY(-50%);
    background: transparent; border: 0;
    padding: 6px; border-radius: 6px;
    color: var(--muted); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: color .12s, background .12s;
  }
  .pw-toggle:hover { color: var(--text); background: rgba(15,23,42,.04); }
  .pw-toggle:focus-visible {
    outline: none; color: var(--primary);
    box-shadow: 0 0 0 3px rgba(79,70,229,.18);
  }
  .pw-toggle svg { width: 16px; height: 16px; }
  .pw-toggle .icon-on  { display: none; }
  .pw-toggle.is-shown .icon-off { display: none; }
  .pw-toggle.is-shown .icon-on  { display: inline-block; }

  .submit-btn {
    width: 100%;
    padding: 10px 16px;
    background: var(--primary);
    color: #fff;
    border: 1px solid transparent;
    border-radius: 10px;
    font-family: inherit; font-size: 14px; font-weight: 600;
    cursor: pointer;
    transition: all .15s;
    box-shadow: 0 1px 2px rgba(79,70,229,.2);
    margin-top: 4px;
  }
  .submit-btn:hover {
    background: var(--primary-hover);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px -2px rgba(79,70,229,.3);
  }
  .submit-btn[disabled] { opacity: .6; cursor: not-allowed; transform: none; box-shadow: none; }

  .google-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%;
    padding: 11px 16px;
    background: #ffffff;
    color: var(--text);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    font-family: inherit; font-size: 14px; font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    transition: all .15s;
    box-shadow: 0 1px 2px rgba(15,23,42,.04);
  }
  .google-btn:hover {
    border-color: #cbd5e1;
    box-shadow: 0 4px 12px -2px rgba(15,23,42,.08);
    transform: translateY(-1px);
  }
  .google-btn svg { width: 18px; height: 18px; }

  .divider {
    display: flex; align-items: center; gap: 12px;
    color: var(--muted); font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .08em;
    margin: 20px 0 16px;
  }
  .divider::before, .divider::after {
    content: ""; flex: 1; height: 1px; background: var(--card-border);
  }

  .alert {
    padding: 12px 14px; border-radius: 10px;
    font-size: 13.5px; margin-bottom: 16px;
    border: 1px solid;
    display: flex; gap: 10px; align-items: flex-start;
  }
  .alert.error { background: var(--red-bg); color: #991b1b; border-color: var(--red-border); }
  .alert.ok    { background: var(--green-bg); color: #065f46; border-color: var(--green-border); }
  .alert.warn  { background: var(--orange-bg); color: #92400e; border-color: var(--orange-border); }
  .alert svg { width: 18px; height: 18px; flex-shrink: 0; margin-top: 1px; }

  .footer-link {
    text-align: center; font-size: 13px; color: var(--muted);
    margin-top: 18px;
  }
  .footer-link a { color: var(--primary); text-decoration: none; font-weight: 600; }
  .footer-link a:hover { text-decoration: underline; }

  footer.bottom {
    margin-top: 22px; padding-top: 18px;
    border-top: 1px solid var(--card-border);
    font-size: 12px; color: var(--muted); text-align: center;
  }
  footer.bottom .hint { display: block; margin-top: 4px; opacity: .8; }

  .icon-circle {
    width: 56px; height: 56px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 18px;
  }
  .icon-circle.ok    { background: var(--green-bg); color: var(--green); }
  .icon-circle.warn  { background: var(--orange-bg); color: var(--orange); }
  .icon-circle.error { background: var(--red-bg); color: var(--red); }
  .icon-circle svg   { width: 28px; height: 28px; }
  .text-center { text-align: center; }
</style>
</head>
<body>
  <div class="login-card">
    <div class="brand">
      <span class="logo">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
      </span>
      <span>Mailbox Transfer</span>
    </div>

    {% block content %}{% endblock %}
  </div>

<script>
  document.querySelectorAll('.pw-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.target);
      if (!input) return;
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      btn.classList.toggle('is-shown', !showing);
      btn.setAttribute('aria-pressed', String(!showing));
      btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
      input.focus({ preventScroll: true });
    });
  });
</script>
{% block scripts %}{% endblock %}
</body>
</html>
