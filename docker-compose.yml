services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    networks:
      - app

  # Runs mailbox backups whose schedule is due. Same image as web, but it
  # bypasses the entrypoint (no migrate/collectstatic race with web) and never
  # serves traffic, so a long backup can't tie up a request thread.
  scheduler:
    build: .
    restart: unless-stopped
    env_file: .env
    entrypoint: ["python"]
    command: ["manage.py", "run_scheduled_backups", "--loop", "--interval", "60"]
    depends_on:
      - web
    networks:
      - app

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/certbot/conf:/etc/letsencrypt:ro
      - ./docker/certbot/www:/var/www/certbot:ro
    depends_on:
      - web
    networks:
      - app
    command: >
      /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - ./docker/certbot/conf:/etc/letsencrypt
      - ./docker/certbot/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

networks:
  app:
    driver: bridge
